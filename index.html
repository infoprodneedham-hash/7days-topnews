<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Australia Hub | Geelong Live</title>
    <style>
        :root {
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --accent-blue: #0984e3;
            --text-dark: #2d3436;
            --text-light: #636e72;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header-layout {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        .weather-box h2 { margin: 0; font-size: 1.3rem; color: var(--accent-blue); }
        .current-temp { font-size: 4rem; font-weight: 800; margin: 5px 0; letter-spacing: -2px; }
        .local-time-large { 
            font-size: 2.2rem; 
            font-weight: 700; 
            color: var(--text-dark); 
            margin-bottom: 15px;
            font-family: 'Courier New', monospace;
        }
        .weather-details { font-size: 0.95rem; color: var(--text-light); line-height: 1.5; }

        .news-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        .section-title {
            font-size: 0.85rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--accent-blue);
            margin-bottom: 20px;
            border-bottom: 2px solid #f0f4f8;
            padding-bottom: 8px;
        }
        .news-item { margin-bottom: 20px; }
        .news-item h3 { margin: 0 0 5px 0; font-size: 1rem; line-height: 1.4; color: #1e272e; }
        .news-item p { margin: 0; font-size: 0.85rem; color: var(--text-light); line-height: 1.5; }

        .forecast-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
        }
        .forecast-day {
            text-align: center;
            padding: 15px 10px;
            background: #f8f9fa;
            border-radius: 12px;
        }
        .day-label { font-weight: bold; font-size: 0.75rem; color: var(--accent-blue); }
        .day-temp { font-size: 1.4rem; font-weight: 800; margin: 5px 0; }

        .world-clocks {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 15px;
        }
        .clock-item { text-align: center; }
        .clock-name { font-size: 0.7rem; font-weight: 700; color: var(--text-light); text-transform: uppercase; }
        .clock-val { display: block; font-size: 1.1rem; font-weight: 700; font-family: monospace; }

        @media (max-width: 1000px) {
            .header-layout, .news-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="header-layout">
        <div class="card weather-box">
            <h2 id="city-name">Geelong, VIC</h2>
            <div class="current-temp" id="main-temp">--°C</div>
            <div id="local-clock" class="local-time-large">--:--:-- --</div>
            <div id="weather-desc" style="font-weight: 600; margin-bottom: 5px; text-transform: capitalize;">Loading...</div>
            <div class="weather-details" id="weather-details">
                Humidity: --%<br>
                Wind: --<br>
                UV Index: --
            </div>
        </div>

        <div class="card">
            <div class="news-grid">
                <div>
                    <div class="section-title">Australia News</div>
                    <div id="aus-news-container">Loading news...</div>
                </div>
                <div>
                    <div class="section-title">World News</div>
                    <div id="world-news-container">Loading news...</div>
                </div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="section-title">5-Day Forecast</div>
        <div class="forecast-row" id="forecast-container">
            </div>
    </div>

    <div class="card">
        <div class="world-clocks">
            <div class="clock-item"><span class="clock-name">London</span><span id="tz-london" class="clock-val">--:--:-- --</span></div>
            <div class="clock-item"><span class="clock-name">New York</span><span id="tz-ny" class="clock-val">--:--:-- --</span></div>
            <div class="clock-item"><span class="clock-name">Tokyo</span><span id="tz-tokyo" class="clock-val">--:--:-- --</span></div>
            <div class="clock-item"><span class="clock-name">Sydney</span><span id="tz-sydney" class="clock-val">--:--:-- --</span></div>
            <div class="clock-item"><span class="clock-name">Perth</span><span id="tz-perth" class="clock-val">--:--:-- --</span></div>
        </div>
    </div>

    <script>
        // REPLACE THESE WITH YOUR KEYS
        const WEATHER_API_KEY = 'YOUR_OPENWEATHER_KEY';
        const NEWS_API_KEY = 'YOUR_NEWS_API_KEY';
        const CITY = 'Geelong,AU';

        function updateClocks() {
            const now = new Date();
            const format = (tz) => now.toLocaleTimeString('en-AU', { 
                timeZone: tz, hour12: true, hour: '2-digit', minute: '2-digit', second: '2-digit' 
            }).toUpperCase();

            document.getElementById('local-clock').textContent = format('Australia/Melbourne');
            document.getElementById('tz-london').textContent = format('Europe/London');
            document.getElementById('tz-ny').textContent = format('America/New_York');
            document.getElementById('tz-tokyo').textContent = format('Asia/Tokyo');
            document.getElementById('tz-sydney').textContent = format('Australia/Sydney');
            document.getElementById('tz-perth').textContent = format('Australia/Perth');
        }

        async function fetchWeather() {
            try {
                // Current Weather
                const currRes = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${CITY}&units=metric&appid=${WEATHER_API_KEY}`);
                const currData = await currRes.json();
                
                document.getElementById('main-temp').textContent = `${Math.round(currData.main.temp)}°C`;
                document.getElementById('weather-desc').textContent = currData.weather[0].description;
                document.getElementById('weather-details').innerHTML = `
                    Humidity: ${currData.main.humidity}%<br>
                    Wind: ${currData.wind.speed} m/s<br>
                    Pressure: ${currData.main.pressure} hPa
                `;

                // Forecast
                const foreRes = await fetch(`https://api.openweathermap.org/data/2.5/forecast?q=${CITY}&units=metric&appid=${WEATHER_API_KEY}`);
                const foreData = await foreRes.json();
                const container = document.getElementById('forecast-container');
                container.innerHTML = '';
                
                // Filter for one forecast per day (approx noon)
                const daily = foreData.list.filter(f => f.dt_txt.includes("12:00:00"));
                daily.forEach(day => {
                    const date = new Date(day.dt * 1000);
                    const dayName = date.toLocaleDateString('en-AU', {weekday: 'short'}).toUpperCase();
                    container.innerHTML += `
                        <div class="forecast-day">
                            <div class="day-label">${dayName}</div>
                            <div class="day-temp">${Math.round(day.main.temp)}°</div>
                            <div style="font-size:0.7rem">${day.weather[0].main}</div>
                        </div>
                    `;
                });
            } catch (e) { console.error("Weather failed", e); }
        }

        async function fetchNews() {
            try {
                // Aus News
                const ausRes = await fetch(`https://newsapi.org/v2/top-headlines?country=au&apiKey=${NEWS_API_KEY}`);
                const ausData = await ausRes.json();
                renderNews('aus-news-container', ausData.articles.slice(0, 5));

                // World News
                const worldRes = await fetch(`https://newsapi.org/v2/top-headlines?language=en&apiKey=${NEWS_API_KEY}`);
                const worldData = await worldRes.json();
                renderNews('world-news-container', worldData.articles.slice(0, 3));
            } catch (e) { console.error("News failed", e); }
        }

        function renderNews(id, articles) {
            const container = document.getElementById(id);
            container.innerHTML = articles.map(a => `
                <div class="news-item">
                    <h3>${a.title}</h3>
                    <p>${a.description || 'No description available.'}</p>
                </div>
            `).join('');
        }

        // Initialize and Set Intervals
        setInterval(updateClocks, 1000); // Clock every second
        
        // Data updates every 1 hour (3,600,000 ms)
        setInterval(() => {
            fetchWeather();
            fetchNews();
        }, 3600000);

        // Initial Load
        updateClocks();
        fetchWeather();
        fetchNews();
    </script>
</body>
</html>
