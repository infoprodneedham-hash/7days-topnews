<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Australia Hub | Geelong (No Keys)</title>
    <style>
        :root {
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --accent-blue: #0984e3;
            --text-dark: #2d3436;
            --text-light: #636e72;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header-layout { display: grid; grid-template-columns: 350px 1fr; gap: 20px; }
        .card { background: var(--card-bg); padding: 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }

        .current-temp { font-size: 4rem; font-weight: 800; margin: 5px 0; letter-spacing: -2px; }
        .local-time-large { font-size: 2.2rem; font-weight: 700; margin-bottom: 15px; font-family: 'Courier New', monospace; }
        
        .news-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .section-title { font-size: 0.85rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent-blue); margin-bottom: 20px; border-bottom: 2px solid #f0f4f8; padding-bottom: 8px; }

        .news-item { margin-bottom: 20px; }
        .news-item h3 { margin: 0 0 5px 0; font-size: 0.95rem; color: #1e272e; line-height: 1.4; }
        .news-item p { margin: 0; font-size: 0.8rem; color: var(--text-light); line-height: 1.5; }

        .expand-btn {
            background: none;
            border: none;
            color: var(--accent-blue);
            padding: 0;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            margin-left: 5px;
        }
        .expand-btn:hover { text-decoration: underline; }

        .world-clocks-container {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px dashed #e2e8f0;
        }
        .world-clock-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            margin-bottom: 8px;
        }
        .world-clock-time {
            font-family: 'Courier New', monospace;
            font-weight: 700;
            color: var(--text-dark);
        }

        .forecast-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
        .forecast-day { text-align: center; padding: 15px 10px; background: #f8f9fa; border-radius: 12px; }

        @media (max-width: 1000px) { .header-layout, .news-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div class="header-layout">
        <div class="card weather-box">
            <h2>Geelong, VIC</h2>
            <div id="main-temp" class="current-temp">--°C</div>
            <div id="local-clock" class="local-time-large">--:--:--</div>
            <div id="weather-desc" style="font-weight: 600; text-transform: capitalize; margin-bottom: 10px;">Updating...</div>
            
            <div class="world-clocks-container">
                <div style="font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: var(--text-light); margin-bottom: 10px;">World Clocks</div>
                <div class="world-clock-row">
                    <span style="color: var(--text-light);">London</span>
                    <span id="clock-london" class="world-clock-time">--:--:--</span>
                </div>
                <div class="world-clock-row">
                    <span style="color: var(--text-light);">New York</span>
                    <span id="clock-ny" class="world-clock-time">--:--:--</span>
                </div>
                <div class="world-clock-row">
                    <span style="color: var(--text-light);">Tokyo</span>
                    <span id="clock-tokyo" class="world-clock-time">--:--:--</span>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="news-grid">
                <div>
                    <div class="section-title">ABC News Australia</div>
                    <div id="aus-news">Loading feeds...</div>
                </div>
                <div>
                    <div class="section-title">World Headlines</div>
                    <div id="world-news">Loading feeds...</div>
                </div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="section-title">5-Day Forecast</div>
        <div id="forecast-row" class="forecast-row"></div>
    </div>

    <script>
        // GEELONG COORDINATES
        const LAT = -38.1499;
        const LON = 144.3617;

        // 1. Clock Logic
        function updateClock() {
            const now = new Date();
            
            // Local Time
            document.getElementById('local-clock').textContent = now.toLocaleTimeString('en-AU', {
                timeZone: 'Australia/Melbourne', hour12: true, hour: '2-digit', minute: '2-digit', second: '2-digit'
            }).toUpperCase();

            // International Clocks
            const timeOptions = { hour12: true, hour: '2-digit', minute: '2-digit', second: '2-digit' };
            
            document.getElementById('clock-london').textContent = now.toLocaleTimeString('en-GB', {
                ...timeOptions, timeZone: 'Europe/London'
            }).toUpperCase();
            
            document.getElementById('clock-ny').textContent = now.toLocaleTimeString('en-US', {
                ...timeOptions, timeZone: 'America/New_York'
            }).toUpperCase();
            
            document.getElementById('clock-tokyo').textContent = now.toLocaleTimeString('ja-JP', {
                ...timeOptions, timeZone: 'Asia/Tokyo'
            }).toUpperCase();
        }

        // 2. Weather & Forecast (Open-Meteo: No Key Needed)
        async function fetchWeather() {
            try {
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current_weather=true&daily=temperature_2m_max&timezone=Australia%2FSydney`;
                const res = await fetch(url);
                const data = await res.json();

                document.getElementById('main-temp').textContent = `${Math.round(data.current_weather.temperature)}°C`;
                document.getElementById('weather-desc').textContent = "Current Conditions";

                const forecastContainer = document.getElementById('forecast-row');
                forecastContainer.innerHTML = data.daily.time.slice(0, 5).map((date, i) => {
                    const dayName = new Date(date).toLocaleDateString('en-AU', {weekday: 'short'}).toUpperCase();
                    return `
                        <div class="forecast-day">
                            <div style="font-weight:bold; color:var(--accent-blue); font-size:0.7rem;">${dayName}</div>
                            <div style="font-size:1.4rem; font-weight:800;">${Math.round(data.daily.temperature_2m_max[i])}°</div>
                        </div>`;
                }).join('');
            } catch (e) { console.error("Weather Error", e); }
        }

        // 3. News (RSS to JSON: No Key Needed)
        async function fetchNews() {
            try {
                // Australia News (ABC RSS)
                const abcUrl = `https://api.rss2json.com/v1/api.json?rss_url=https://www.abc.net.au/news/feed/51120/rss.xml`;
                const abcRes = await fetch(abcUrl);
                const abcData = await abcRes.json();
                renderNews('aus-news', abcData.items.slice(0, 4));

                // World News (BBC RSS)
                const bbcUrl = `https://api.rss2json.com/v1/api.json?rss_url=http://feeds.bbci.co.uk/news/world/rss.xml`;
                const bbcRes = await fetch(bbcUrl);
                const bbcData = await bbcRes.json();
                renderNews('world-news', bbcData.items.slice(0, 3));
            } catch (e) { console.error("News Error", e); }
        }

        function renderNews(id, items) {
            document.getElementById(id).innerHTML = items.map(item => {
                const cleanDesc = item.description.replace(/<[^>]*>?/gm, '');
                const isLongText = cleanDesc.length > 80;
                const shortDesc = isLongText ? cleanDesc.substring(0, 80) + '...' : cleanDesc;

                return `
                    <div class="news-item">
                        <h3>${item.title}</h3>
                        <p>
                            <span class="text-short">${shortDesc}</span>
                            ${isLongText ? `
                                <span class="text-full" style="display: none;">${cleanDesc}</span>
                                <button class="expand-btn" onclick="toggleHeadline(this)">Read More</button>
                            ` : ''}
                        </p>
                    </div>
                `;
            }).join('');
        }

        // headline text toggle logic
        function toggleHeadline(btn) {
            const container = btn.parentElement;
            const shortSpan = container.querySelector('.text-short');
            const fullSpan = container.querySelector('.text-full');
            
            if (fullSpan.style.display === 'none') {
                fullSpan.style.display = 'inline';
                shortSpan.style.display = 'none';
                btn.textContent = 'Read Less';
            } else {
                fullSpan.style.display = 'none';
                shortSpan.style.display = 'inline';
                btn.textContent = 'Read More';
            }
        }

        // 4. Update Loop (Every 5 Minutes)
        function refreshAll() {
            fetchWeather();
            fetchNews();
            console.log("Dashboard refreshed at " + new Date().toLocaleTimeString());
        }

        setInterval(updateClock, 1000);
        setInterval(refreshAll, 300000); // 5 minutes

        updateClock();
        refreshAll();
    </script>
</body>
</html>
