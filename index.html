<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Australia Hub | Geelong Live</title>
    <style>
        :root {
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --accent-blue: #0984e3;
            --text-dark: #2d3436;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .header-section {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }

        .temp-display { font-size: 3rem; font-weight: bold; color: var(--accent-blue); }
        .clock { font-size: 1.5rem; font-family: monospace; margin-top: 10px; }
        
        .news-item { margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .news-item:last-child { border: none; }
        .news-title { font-weight: bold; display: block; margin-bottom: 5px; }
        
        h2 { margin-top: 0; color: var(--accent-blue); font-size: 1.2rem; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="header-section">
        <div class="card">
            <h2>Geelong Weather</h2>
            <div id="weather-content">
                <div class="temp-display" id="temp">--°C</div>
                <div id="description">Loading...</div>
                <div class="clock" id="local-clock">00:00:00</div>
            </div>
        </div>

        <div class="card">
            <h2>Latest Headlines</h2>
            <div id="news-content">Fetching news...</div>
        </div>
    </div>

    <script>
        // CONFIGURATION
        const WEATHER_KEY = 'YOUR_OPENWEATHER_KEY';
        const NEWS_KEY = 'YOUR_NEWS_API_KEY';
        const CITY = 'Geelong,AU';

        // 1. CLOCK LOGIC (Updates every second)
        function updateClock() {
            const now = new Date();
            document.getElementById('local-clock').textContent = now.toLocaleTimeString('en-AU');
        }
        setInterval(updateClock, 1000);

        // 2. WEATHER FETCH
        async function fetchWeather() {
            try {
                const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${CITY}&units=metric&appid=${WEATHER_KEY}`);
                const data = await response.json();
                document.getElementById('temp').textContent = `${Math.round(data.main.temp)}°C`;
                document.getElementById('description').textContent = data.weather[0].description;
                console.log("Weather updated at: " + new Date().toLocaleTimeString());
            } catch (error) {
                document.getElementById('description').textContent = "Weather currently unavailable";
            }
        }

        // 3. NEWS FETCH
        async function fetchNews() {
            try {
                const response = await fetch(`https://newsapi.org/v2/top-headlines?country=au&apiKey=${NEWS_KEY}`);
                const data = await response.json();
                const container = document.getElementById('news-content');
                
                container.innerHTML = data.articles.slice(0, 3).map(article => `
                    <div class="news-item">
                        <span class="news-title">${article.title}</span>
                        <small>${article.source.name}</small>
                    </div>
                `).join('');
                console.log("News updated at: " + new Date().toLocaleTimeString());
            } catch (error) {
                document.getElementById('news-content').textContent = "News currently unavailable";
            }
        }

        // 4. AUTOMATION LOGIC
        function refreshData() {
            fetchWeather();
            fetchNews();
        }

        // Run immediately on load
        updateClock();
        refreshData();

        // REFRESH EVERY HOUR (3600000 milliseconds)
        setInterval(refreshData, 3600000);

    </script>
</body>
</html>
